name: Validate snippets

on:
  push:
    branches: [main, sync/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject sensitive tracked files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env([^/]*)?|credentials(\..*)?|.*\.(pfx|p12|pem|key|cer|crt|jks|tfstate|tfvars|tfvars\.json))$'
          if git ls-files | grep -Eiq "$forbidden"; then
            echo "Sensitive files are tracked. Remove them before publishing:"
            git ls-files | grep -Ei "$forbidden"
            exit 1
          fi

      - name: Reject local paths and known credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -IEni -e '([A-Za-z]:[\\/]+Users[\\/]+|/mnt/[a-z]/Users/|/Users/[^/[:space:]]+)' -- ':!*.md'; then
            echo "Personal or local paths were found. Replace them with parameters."
            exit 1
          fi

  script-validation:
    name: Script validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet yamllint
          curl -sSfL https://raw.githubusercontent.com/koalaman/shellcheck/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          echo "$PWD/shellcheck-v0.10.0" >> "$GITHUB_PATH"

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck --severity=error

      - name: Validate YAML files
        shell: bash
        run: yamllint -d relaxed .

      - name: Validate Terraform formatting
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        shell: bash
        run: terraform fmt -check -recursive
