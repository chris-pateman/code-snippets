name: $(BuildDefinitionName).$(DayOfYear)$(Rev:.r)
resources:
  repositories:
    - repository: DeploymentTemplates
      type: git
      name: go-deploy/azure-devops-resources
      ref: 'refs/heads/main'
parameters:
  - name: templates
    type: object
    values: []
    default: [
      "\\gd-api-shared",
    "\\gd-api-webapi",
    "\\gd-az-resourcegroup",
    "\\gd-media-service",
    "\\gd-serverless",
    "\\gd-static-site",
    "\\gd-staticsite",
    "\\gd-app-client"
    ]
stages:

  - stage: 'CIBuild'
    displayName: 'CI Terraform'
    jobs:
      - job: CI_Terraform
        displayName: CI Terraform
        continueOnError: false
        pool:
          displayName: "CI Terraform"
          name: Default
        workspace:
          clean: all
        timeoutInMinutes: 120
        cancelTimeoutInMinutes: 2
        steps:
          - task: TerraformInstaller@0
            displayName: "Install Terraform"
            inputs:
              terraformVersion: '0.13.0'
          ## Template Test
          - ${{ each template in parameters.templates }}:
            - template: GroupTasks/Terraform/_GroupTask-Test-Terraform.yml@DeploymentTemplates
              parameters:
                terraformPath: $(Build.SourcesDirectory)\templates${{template}}
          - task: PowerShell@2
            displayName: "Validate Passwords are Secure"
            inputs:
              filePath: '$(Build.SourcesDirectory)/validateSecurePasswords.ps1'
              arguments: '-testingPath "$(Build.SourcesDirectory)"'
              failOnStderr: true
              workingDirectory: '$(Build.SourcesDirectory)'